name: Build Multi-Arch JARs

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - x86
          - arm
          - both

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify with Maven
        run: ./mvnw verify