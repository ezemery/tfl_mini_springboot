name: Build Multi-Arch JARs

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - x86
          - arm
          - both

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify with Maven
        run: ./mvnw verify

      - name: Build x86 JAR
        if: github.event_name == 'pull_request' || github.event.inputs.architecture == 'x86' || github.event.inputs.architecture == 'both'
        run: ./mvnw package -DskipTests
        # Note: In a real scenario, you might use profiles or specific flags if the build output differs for architectures.
        # For standard Spring Boot JARs, the bytecode is platform-independent, but this demonstrates the logic.

      - name: Upload x86 Artifact
        if: github.event_name == 'pull_request' || github.event.inputs.architecture == 'x86' || github.event.inputs.architecture == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: tfl-app-x86
          path: target/*.jar

      - name: Build ARM JAR
        if: github.event_name == 'pull_request' || github.event.inputs.architecture == 'arm' || github.event.inputs.architecture == 'both'
        run: ./mvnw package -DskipTests
        # Similar to x86 build, adjusted if there were architecture-specific dependencies or properties.

      - name: Upload ARM Artifact
        if: github.event_name == 'pull_request' || github.event.inputs.architecture == 'arm' || github.event.inputs.architecture == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: tfl-app-arm
          path: target/*.jar
